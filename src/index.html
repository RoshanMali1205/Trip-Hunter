<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trip Hunter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Trip Hunter — collaborative trip planning for office teams, from idea to expense settlement."
    />
    <meta name="theme-color" content="#ff6a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trip Hunter" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <script>
      try {
        var raw = localStorage.getItem('trip-hunter:theme');
        var theme = raw ? JSON.parse(raw) : 'light';
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0f1218');
        }
      } catch (e) {}
      try {
        // Independence Day: Tiranga favicon through 15 Aug EOD IST
        var parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Kolkata',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        }).formatToParts(new Date());
        var month = Number((parts.find(function (p) { return p.type === 'month'; }) || {}).value || 0);
        var day = Number((parts.find(function (p) { return p.type === 'day'; }) || {}).value || 0);
        if (month === 8 && day >= 1 && day <= 15) {
          var svgIcon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
          if (svgIcon) svgIcon.setAttribute('href', 'favicon-tiranga.svg');
          var ico = document.querySelector('link[rel="icon"][type="image/x-icon"]');
          if (ico) ico.parentNode.removeChild(ico);
          document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (link) {
            link.setAttribute('href', 'icons/tiranga-180x180.png');
          });
          var manifest = document.querySelector('link[rel="manifest"]');
          if (manifest) manifest.setAttribute('href', 'manifest-tiranga.webmanifest');
        }
      } catch (e) {}
    </script>
    <script src="/env.js"></script>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using Trip Hunter.</noscript>
  </body>
</html>

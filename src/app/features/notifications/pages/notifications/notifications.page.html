<section class="th-page">
  <header class="th-page-header">
    <div>
      <h1>Notifications</h1>
      <p>{{ unread() }} unread</p>
    </div>
    @if (unread() > 0) {
      <app-button variant="link" (click)="markAll()">Mark all read</app-button>
    }
  </header>

  <div class="th-panel">
    <ul>
      @for (n of notifications(); track n.id) {
        <li [class.unread]="!n.read" (click)="markOne(n.id)">
          <mat-icon>{{ n.read ? 'notifications' : 'mark_email_unread' }}</mat-icon>
          <div>
            <strong>{{ n.title }}</strong>
            <p>{{ n.message }}</p>
            <span>{{ n.createdAt | date: 'medium' }}</span>
          </div>
        </li>
      }
    </ul>
  </div>
</section>

<div class="toast-host" aria-live="polite" aria-relevant="additions">
  @for (toast of toasts.items(); track toast.id) {
    <article class="toast" [class]="'toast toast--' + toast.kind" role="status">
      <span class="toast__icon" aria-hidden="true">
        <mat-icon>{{ iconFor(toast.kind) }}</mat-icon>
      </span>
      <div class="toast__body">
        <strong>{{ toast.title }}</strong>
        <p>{{ toast.message }}</p>
      </div>
      <button type="button" class="toast__close" (click)="dismiss(toast.id)" aria-label="Dismiss">
        <mat-icon>close</mat-icon>
      </button>
    </article>
  }
</div>

@if (visible()) {
  <aside
    class="tiranga"
    role="img"
    aria-label="Happy Independence Day — Indian flag until 15 August"
    title="Happy Independence Day"
  >
    <span class="tiranga__ring" aria-hidden="true"></span>
    <svg class="tiranga__flag" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="36" height="12" y="0" fill="#FF9933" />
      <rect width="36" height="12" y="12" fill="#FFFFFF" />
      <rect width="36" height="12" y="24" fill="#138808" />
      <!-- Ashoka Chakra -->
      <g transform="translate(18 18)">
        <circle r="3.55" fill="none" stroke="#000080" stroke-width="1.05" />
        <circle r="0.65" fill="#000080" />
        <g stroke="#000080" stroke-width="0.55" stroke-linecap="round">
          <line y2="-3.2" />
          <line y2="-3.2" transform="rotate(15)" />
          <line y2="-3.2" transform="rotate(30)" />
          <line y2="-3.2" transform="rotate(45)" />
          <line y2="-3.2" transform="rotate(60)" />
          <line y2="-3.2" transform="rotate(75)" />
          <line y2="-3.2" transform="rotate(90)" />
          <line y2="-3.2" transform="rotate(105)" />
          <line y2="-3.2" transform="rotate(120)" />
          <line y2="-3.2" transform="rotate(135)" />
          <line y2="-3.2" transform="rotate(150)" />
          <line y2="-3.2" transform="rotate(165)" />
          <line y2="-3.2" transform="rotate(180)" />
          <line y2="-3.2" transform="rotate(195)" />
          <line y2="-3.2" transform="rotate(210)" />
          <line y2="-3.2" transform="rotate(225)" />
          <line y2="-3.2" transform="rotate(240)" />
          <line y2="-3.2" transform="rotate(255)" />
          <line y2="-3.2" transform="rotate(270)" />
          <line y2="-3.2" transform="rotate(285)" />
          <line y2="-3.2" transform="rotate(300)" />
          <line y2="-3.2" transform="rotate(315)" />
          <line y2="-3.2" transform="rotate(330)" />
          <line y2="-3.2" transform="rotate(345)" />
        </g>
      </g>
    </svg>
    <em class="tiranga__label">15 Aug</em>
  </aside>
}

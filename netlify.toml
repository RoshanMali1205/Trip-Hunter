[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist/trip-hunter/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # --include=dev: build needs @angular/cli and server's typescript, both
  # devDependencies. Without this, setting NODE_ENV=production (used for
  # server runtime behavior) makes npm skip devDependencies during install.
  NPM_FLAGS = "--no-fund --no-audit --include=dev"
  # SUPABASE_URL/SUPABASE_PUBLIC_KEY are intentionally public (shipped to the
  # browser via public/env.js for client-side Supabase Auth). The real secret,
  # SUPABASE_SERVICE_ROLE_KEY, is never written there and stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLIC_KEY"

[functions]
  node_bundler = "esbuild"
  # Keep Express external (dynamic requires). Bundle server's zod@3 via esbuild
  # so root zod@4 used by the SPA does not leak into the API function.
  external_node_modules = ["express", "cors", "@supabase/supabase-js", "serverless-http", "dotenv"]
  included_files = ["server/dist/**"]

# Critical for mobile PWA updates: never long-cache the SW control files or
# index.html, or phones keep an old shell after Netlify deploys.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/env.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

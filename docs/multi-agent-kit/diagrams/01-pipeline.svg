<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-coral" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ff6a1a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="82%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.22"/>
